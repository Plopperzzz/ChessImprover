<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Engine Room</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="login-screen" class="overlay hidden">
  <div class="login-card">
    <h1>Engine Room</h1>
    <div id="account-list" class="account-list"></div>
    <details id="bootstrap-details">
      <summary>Add an account</summary>
      <form id="bootstrap-form">
        <input type="text" id="bootstrap-username" placeholder="username" required />
        <input type="text" id="bootstrap-displayname" placeholder="display name (matches your PGN header)" required />
        <button type="submit">Create account</button>
      </form>
    </details>
  </div>
</div>

<div id="app" class="hidden">
  <header id="topbar">
    <span id="whoami"></span>
    <div class="spacer"></div>
    <button id="settings-btn">Settings</button>
    <button id="logout-btn">Log out</button>
  </header>

  <main id="layout">
    <section id="board-col">
      <div id="eval-bar"><div id="eval-fill"></div><span id="eval-label">0.0</span></div>
      <div id="clock-row" class="hidden">
        <span class="clock" id="clock-top"><b id="clock-top-label">Maia</b> <span id="clock-top-time">--:--</span></span>
        <span class="clock" id="clock-bottom"><b id="clock-bottom-label">You</b> <span id="clock-bottom-time">--:--</span></span>
      </div>
      <div id="board"></div>
      <div id="nav-buttons">
        <button id="nav-start" title="First move">|&lt;</button>
        <button id="nav-prev" title="Previous move">&lt;</button>
        <button id="nav-next" title="Next move">&gt;</button>
        <button id="nav-end" title="Last move">&gt;|</button>
      </div>
      <div id="fen-row">
        <input type="text" id="fen-box" readonly />
        <button id="fen-copy">Copy</button>
      </div>
      <div id="fen-row">
        <input type="text" id="fen-goto" placeholder="paste a FEN to jump to it" />
        <button id="fen-goto-btn">Go</button>
      </div>
    </section>

    <section id="side-col">
      <div class="panel">
        <h3>Load games</h3>
        <input type="file" id="pgn-files" accept=".pgn" multiple />
        <textarea id="pgn-paste" placeholder="...or paste PGN text here"></textarea>
        <button id="pgn-upload-btn">Upload</button>
        <div id="upload-status"></div>
      </div>

      <div class="panel">
        <h3>Games</h3>
        <div id="game-picker"></div>
      </div>

      <div class="panel">
        <h3>Play vs Maia3</h3>
        <div class="play-grid">
          <label>Maia Elo <input type="number" id="p-elo" value="1500" min="100" max="4000" /></label>
          <label>You play
            <select id="p-color">
              <option value="w">White</option>
              <option value="b">Black</option>
              <option value="random">Random</option>
            </select>
          </label>
          <label>Base (min) <input type="number" id="p-base" value="10" min="0" max="180" /></label>
          <label>Increment (s) <input type="number" id="p-inc" value="0" min="0" max="60" /></label>
        </div>
        <div class="play-buttons">
          <button id="p-start">Start game</button>
          <button id="p-resign" disabled>Resign</button>
          <button id="p-save" disabled>Save to library</button>
          <button id="p-exit" class="hidden">Back to analysis</button>
        </div>
        <div id="p-status"></div>
        <div id="p-notes"></div>
      </div>

      <div class="panel">
        <h3>Analysis</h3>
        <label class="run-row">Save into run
          <span class="run-controls">
            <select id="run-picker"></select>
            <button type="button" id="run-new" title="Create a new run">+</button>
          </span>
        </label>
        <div class="play-buttons">
          <button id="quick-analysis-btn" disabled>Quick</button>
          <button id="full-analysis-btn" disabled title="Quick + Maia Elo sweep + Great/Brilliant">Full</button>
        </div>
        <div id="analysis-progress"><div id="analysis-progress-fill"></div></div>
        <div id="analysis-status"></div>
        <div id="analysis-summary"></div>
      </div>

      <div class="panel">
        <h3>Elo estimate (Maia sweep)</h3>
        <button id="sweep-btn" disabled>Run Elo sweep</button>
        <div id="sweep-progress"><div id="sweep-progress-fill"></div></div>
        <div id="sweep-status"></div>
        <div id="sweep-results"></div>
      </div>

      <div class="panel">
        <h3>Moves</h3>
        <div id="move-table-wrap">
          <table id="move-table"><tbody></tbody></table>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="settings-dialog" class="overlay hidden">
  <div class="dialog-card">
    <h2>Engine Settings</h2>
    <form id="settings-form">
      <fieldset>
        <legend>Your profile</legend>
        <label>Display name (matched against PGN White/Black headers)
          <input type="text" id="s-display-name" />
        </label>
        <label>Board / piece set
          <select id="s-asset-set"></select>
        </label>
        <!-- The dialog is a full-screen overlay, so the real board behind it
             is not visible while choosing -- this swatch is the feedback. -->
        <div id="asset-preview" aria-hidden="true"></div>
      </fieldset>

      <fieldset>
        <legend>Stockfish</legend>
        <label>Engine
          <select id="s-sf-family"></select>
        </label>
        <label id="s-sf-build-row">Build
          <select id="s-sf-build"></select>
        </label>
        <label>Threads <input type="number" id="s-sf-threads" min="1" max="64" /></label>
        <label>Hash (MB) <input type="number" id="s-sf-hash" min="1" max="16384" /></label>
        <label>Limit type
          <select id="s-sf-limit-type">
            <option value="depth">Depth</option>
            <option value="movetime">Move time (ms)</option>
          </select>
        </label>
        <label>Limit value <input type="number" id="s-sf-limit-value" min="1" /></label>
        <label>Skill level (blank = full strength)
          <input type="number" id="s-sf-skill" min="0" max="20" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Maia3</legend>
        <label>Engine
          <select id="s-maia-family"></select>
        </label>
        <label>Model size
          <select id="s-maia-size"></select>
        </label>
        <!-- Maia3 ships the model size as a separate executable, so this
             picks a binary rather than setting a UCI option. -->
        <div id="s-maia-resolved"></div>
        <label>Elo min <input type="number" id="s-maia-elo-min" /></label>
        <label>Elo max <input type="number" id="s-maia-elo-max" /></label>
        <label>Elo step <input type="number" id="s-maia-elo-step" /></label>
        <label>Great: max win-prob given up vs best (0.02 = near-lossless)
          <input type="number" id="s-great-drop" step="0.01" min="0" max="0.5" />
        </label>
        <label>Great: max share of players at your level who'd find it
          <input type="number" id="s-great-rate" step="0.05" min="0" max="1" />
        </label>
        <label>Brilliant (Great + a material sacrifice)
          <select id="s-brilliant"><option value="1">On</option><option value="0">Off</option></select>
        </label>
        <!-- Rendered from the options this engine actually advertises
             (temperature and anything else it exposes). -->
        <div id="s-maia-options"></div>
      </fieldset>

      <div id="engines-hint"></div>

      <div class="dialog-actions">
        <button type="button" id="settings-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="promo-root"></div>

<script src="/js/vendor/chess.js"></script>
<script src="/js/board.js"></script>
<script src="/js/explorer.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
